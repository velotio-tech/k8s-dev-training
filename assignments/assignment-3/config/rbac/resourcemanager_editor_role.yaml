# This rule is not used by the project assignment-3 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the assignments.k8s-dev-training.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: assignment-3
    app.kubernetes.io/managed-by: kustomize
  name: resourcemanager-editor-role
rules:
- apiGroups:
  - assignments.k8s-dev-training.com
  resources:
  - resourcemanagers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - assignments.k8s-dev-training.com
  resources:
  - resourcemanagers/status
  verbs:
  - get
