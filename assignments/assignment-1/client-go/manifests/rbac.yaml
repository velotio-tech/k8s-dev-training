apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-crud-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-crud-role
  namespace: default
rules:
  # Pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]

  # Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]

  # Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "update", "delete", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-crud-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: k8s-crud-sa
    namespace: default
roleRef:
  kind: Role
  name: k8s-crud-role
  apiGroup: rbac.authorization.k8s.io
