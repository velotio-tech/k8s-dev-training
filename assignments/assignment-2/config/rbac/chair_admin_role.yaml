# This rule is not used by the project assignment-2 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over furniture.k8s-dev-training.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: assignment-2
    app.kubernetes.io/managed-by: kustomize
  name: chair-admin-role
rules:
- apiGroups:
  - furniture.k8s-dev-training.com
  resources:
  - chairs
  verbs:
  - '*'
- apiGroups:
  - furniture.k8s-dev-training.com
  resources:
  - chairs/status
  verbs:
  - get
